services:

  mongodb:
    image: mongo:7
    container_name: mongodb-produtos
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db


  api-python:
    build: .
    container_name: api-python
    restart: always
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://mongodb:27017
    ports:
      - "8000:8000"


volumes:
  mongo_data:

name: CI/CD Pipeline - API Python

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ./requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate Python Code
        run: python -m compileall .

      - name: Start API
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > uvicorn.pid

      - name: Validate API
        run: |
          sleep 5
          curl --fail http://localhost:8000/

      - name: Stop API
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill $(cat uvicorn.pid) || true
          fi

  cd:
    name: Continuous Delivery & Registry Push
    needs: [ci]
    if: ${{ needs.ci.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_PYTHON_API_LOGIN }}
          password: ${{ secrets.DOCKER_PYTHON_API_PASSWORD }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_PYTHON_API_LOGIN }}/api-python:latest
            ${{ secrets.DOCKER_PYTHON_API_LOGIN }}/api-python:1.0.${{ github.run_number }}
            ${{ secrets.DOCKER_PYTHON_API_LOGIN }}/api-python:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
